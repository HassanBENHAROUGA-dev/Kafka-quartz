# ====================
# Spring Boot Database Configuration
# ====================

# JDBC URL for the MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/adjustements

# Database username
spring.datasource.username=root

# Database password (use environment variable for production)
spring.datasource.password=${DB_PASSWORD:}

# JDBC driver class for MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Maximum number of connections in the Hikari connection pool
spring.datasource.hikari.maximum-pool-size=10

# ====================
# JPA/Hibernate Configuration
# ====================

# Dialect for MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Automatically update the database schema based on entity classes
spring.jpa.hibernate.ddl-auto=update

# Log SQL queries to the console for debugging
spring.jpa.show-sql=true

# ====================
# Quartz Scheduler Configuration
# ====================

# Use a JDBC-based job store for Quartz
spring.quartz.job-store-type=jdbc

# Initialize the Quartz schema automatically (use NEVER in production after tables are created)
spring.quartz.jdbc.initialize-schema=always

# Quartz Properties
# =================

# Name of the Quartz scheduler instance
spring.quartz.properties.org.quartz.scheduler.instanceName=MyScheduler

# Automatically generate a unique instance ID for the scheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO

# Use a JDBC job store with transactions
spring.quartz.properties.org.quartz.jobStore.class=org.quartz.impl.jdbcjobstore.JobStoreTX

# Use the standard JDBC delegate for MySQL
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate

# Data source for the Quartz job store
spring.quartz.properties.org.quartz.jobStore.dataSource=quartzDataSource

# Prefix for Quartz tables in the database
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
logging.level.org.quartz=DEBUG
logging.level.org.springframework.scheduling.quartz=DEBUG
# Number of threads in the Quartz thread pool
spring.quartz.properties.org.quartz.threadPool.threadCount=5

# Quartz DataSource Configuration
# ==============================

# JDBC driver class for the Quartz data source
spring.quartz.properties.org.quartz.dataSource.quartzDataSource.driver=com.mysql.cj.jdbc.Driver

# JDBC URL for the Quartz data source
spring.quartz.properties.org.quartz.dataSource.quartzDataSource.URL=jdbc:mysql://localhost:3306/adjustements

# Database username for the Quartz data source
spring.quartz.properties.org.quartz.dataSource.quartzDataSource.user=root

# Database password for the Quartz data source (use environment variable for production)
spring.quartz.properties.org.quartz.dataSource.quartzDataSource.password=${QUARTZ_DB_PASSWORD:}

# Maximum number of connections for the Quartz data source
spring.quartz.properties.org.quartz.dataSource.quartzDataSource.maxConnections=10

# ====================
# Job Configuration
# ====================

# Cron expression for scheduling the adjustment job (every 30 seconds)
adjustment.job.cron=0/30 * * * * ?

# Job-specific EDP code
adjustment.job.edp-code=EDP

# Number of days to look back for data in the job
adjustment.job.days-to-look-back=1

# ====================
# Kafka Configuration
# ====================

# Kafka broker address
spring.kafka.bootstrap-servers=localhost:29092

# Default Kafka topic for the producer
spring.kafka.producer.topic=adjustment-ssy

# Kafka Producer Configuration
# ============================

# Automatically create topics if they do not exist
spring.kafka.producer.properties.auto.create.topics.enable=true

# Number of retries for failed message sends
spring.kafka.producer.retries=3

# Delay between retries for failed message sends (in milliseconds)
spring.kafka.producer.retry.backoff.ms=1000

# Maximum time to wait for a response from the Kafka broker (in milliseconds)
spring.kafka.producer.properties.request.timeout.ms=30000

# Kafka Topic Configuration
# ========================

# Default Kafka topic for the producer template
spring.kafka.template.default-topic=adjustment-ssy

# ====================
# Server Configuration
# ====================

# Port on which the Spring Boot application will run
server.port=${SERVER_PORT:8090}
